<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Synergia // Swagger API UI</title>
  <link rel="icon" type="image/jpeg" href="/logo-small.jpg" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
  <style>
    html {
      box-sizing: border-box;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #0a0a0f;
    }
    /* Dark Theme adjustments to match Synergia's brand */
    .swagger-ui {
      filter: invert(0.88) hue-rotate(155deg);
    }
    .swagger-ui .topbar {
      display: none;
    }
    .swagger-header-container {
      background: #050508;
      padding: 16px 24px;
      border-bottom: 1px solid #1a1a26;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .swagger-header-container span {
      color: #00ff88;
      font-family: 'Orbitron', 'Courier New', monospace;
      font-weight: bold;
      letter-spacing: 0.1em;
      font-size: 0.95rem;
    }
    .swagger-header-container a {
      color: #8c00f0;
      text-decoration: none;
      font-family: monospace;
      font-weight: bold;
      font-size: 0.85rem;
      border: 1px solid #8c00f0;
      padding: 6px 12px;
      transition: all 150ms ease;
    }
    .swagger-header-container a:hover {
      background: #8c00f0;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(140, 0, 240, 0.4);
    }
  </style>
</head>
<body>
  <div class="swagger-header-container">
    <span>SYNERGIA // REST SWAGGER PLAYGROUND</span>
    <a href="/docs/api-rest/">← VOLVER A LAS DOCS</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        deepLinking: true
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
