<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Synergia // Swagger API UI</title>
  <link rel="icon" type="image/jpeg" href="./logo-small.jpg" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
  <style>
    :root {
      --bg-color: #ffffff;
      --header-bg: #ffffff;
      --header-border: #E4E3DF;
      --text-color: #0D0D0D;
      --text-muted: #7A7A76;
      --accent-color: #2997FF;
      --accent-hover: #0066cc;
      --card-bg: #F2F2F7;
      --input-bg: #ffffff;
      --border-color: #E4E3DF;
      --font-family: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="dark"] {
      --bg-color: #0D0D0D;
      --header-bg: #0D0D0D;
      --header-border: #26262B;
      --text-color: #F5F5F7;
      --text-muted: #8E8E93;
      --accent-color: #2997FF;
      --accent-hover: #66b3ff;
      --card-bg: #141418;
      --input-bg: #1e1e24;
      --border-color: #26262B;
    }

    html {
      box-sizing: border-box;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }

    body {
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      transition: background 150ms, color 150ms;
    }

    /* Header styling matching Synergia starlight header exactly */
    .swagger-header-container {
      background: var(--header-bg);
      padding: 14px 24px;
      border-bottom: 1px solid var(--header-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 150ms, border-color 150ms;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand .logo {
      height: 24px;
      width: auto;
      border: 1px solid var(--header-border);
      border-radius: 0;
    }

    .brand span {
      color: var(--text-color);
      font-family: var(--font-family);
      font-weight: 500;
      letter-spacing: normal;
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Back Button: EXACTLY matching openapi-download-btn */
    .back-btn {
      display: inline-block;
      padding: 8px 16px;
      background: var(--text-color) !important;
      color: var(--bg-color) !important;
      border: 1px solid var(--text-color);
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none !important;
      text-transform: none;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
      white-space: nowrap;
      border-radius: 2px;
      cursor: pointer;
    }

    .back-btn:hover {
      background: var(--accent-color) !important;
      border-color: var(--accent-color) !important;
      color: #ffffff !important;
    }

    /* Theme Toggle Button matching Starlight monochrome controls */
    .theme-toggle-btn {
      background: none;
      border: 1px solid var(--header-border);
      color: var(--text-muted);
      padding: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      transition: all 150ms ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--accent-color);
      color: var(--text-color);
    }

    .theme-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .sun-icon { display: none; }
    .moon-icon { display: block; }
    [data-theme="dark"] .sun-icon { display: block; }
    [data-theme="dark"] .moon-icon { display: none; }

    /* Custom Swagger UI integration overrides */
    .swagger-ui {
      color: var(--text-color) !important;
      font-family: var(--font-family) !important;
    }

    .swagger-ui .info .title,
    .swagger-ui .info p,
    .swagger-ui .info li,
    .swagger-ui .info a,
    .swagger-ui .opblock-tag,
    .swagger-ui .opblock .opblock-summary-path,
    .swagger-ui .opblock .opblock-summary-description,
    .swagger-ui .tab li,
    .swagger-ui .response-col_status,
    .swagger-ui .response-col_links,
    .swagger-ui .parameter__name,
    .swagger-ui .parameter__type,
    .swagger-ui .parameter__in,
    .swagger-ui .model-title,
    .swagger-ui .model,
    .swagger-ui label,
    .swagger-ui h1, .swagger-ui h2, .swagger-ui h3, .swagger-ui h4, .swagger-ui h5, .swagger-ui h6 {
      color: var(--text-color) !important;
    }

    .swagger-ui .info .title small {
      background: var(--card-bg) !important;
      color: var(--text-color) !important;
    }

    /* Version Badge: Minimalist, matching other documentation labels */
    .swagger-ui pre.version {
      background: var(--card-bg) !important;
      color: var(--text-muted) !important;
      border: 1px solid var(--border-color) !important;
      padding: 3px 6px !important;
      border-radius: 2px !important;
      font-family: monospace !important;
      font-weight: 500 !important;
      font-size: 11px !important;
      margin: 0 0 0 10px !important;
      display: inline-block !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
    }

    .swagger-ui .scheme-container,
    .swagger-ui .servers-title,
    .swagger-ui .servers > label,
    .swagger-ui .opblock-tag-section {
      background: var(--bg-color) !important;
      color: var(--text-color) !important;
    }

    .swagger-ui .scheme-container {
      border-bottom: 1px solid var(--border-color);
      box-shadow: none !important;
      background: var(--card-bg) !important;
    }

    .swagger-ui select {
      background: var(--input-bg) !important;
      color: var(--text-color) !important;
      border: 1px solid var(--border-color) !important;
    }

    .swagger-ui .opblock {
      background: var(--card-bg) !important;
      border: 1px solid var(--border-color) !important;
      box-shadow: none !important;
    }

    .swagger-ui .opblock .opblock-section-header {
      background: var(--card-bg) !important;
      border-bottom: 1px solid var(--border-color) !important;
    }

    .swagger-ui .opblock .opblock-section-header h4 {
      color: var(--text-color) !important;
    }

    .swagger-ui .opblock .tabli button {
      color: var(--text-color) !important;
    }

    .swagger-ui .opblock .tabli.active button {
      color: var(--accent-color) !important;
    }

    .swagger-ui .opblock .opblock-summary-method {
      border-radius: 2px !important;
      font-family: monospace !important;
    }

    /* Style Swagger UI native buttons to match our premium monochrome style */
    .swagger-ui .btn {
      font-family: var(--font-family) !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      border-radius: 2px !important;
      padding: 6px 12px !important;
      transition: background 150ms, color 150ms, border-color 150ms !important;
    }

    /* Authorize / Try it out buttons */
    .swagger-ui .btn.authorize,
    .swagger-ui .btn.try-out__btn {
      background: var(--text-color) !important;
      color: var(--bg-color) !important;
      border: 1px solid var(--text-color) !important;
      box-shadow: none !important;
    }

    .swagger-ui .btn.authorize:hover,
    .swagger-ui .btn.try-out__btn:hover {
      background: var(--accent-color) !important;
      border-color: var(--accent-color) !important;
      color: #ffffff !important;
    }

    /* Execute Button */
    .swagger-ui .btn.execute {
      background: var(--accent-color) !important;
      border-color: var(--accent-color) !important;
      color: #ffffff !important;
      box-shadow: none !important;
    }

    .swagger-ui .btn.execute:hover {
      background: var(--accent-hover) !important;
      border-color: var(--accent-hover) !important;
    }

    /* Clear / Cancel buttons */
    .swagger-ui .btn.cancel,
    .swagger-ui .btn.clear {
      background: transparent !important;
      border: 1px solid var(--border-color) !important;
      color: var(--text-color) !important;
      box-shadow: none !important;
    }

    .swagger-ui .btn.cancel:hover,
    .swagger-ui .btn.clear:hover {
      border-color: var(--accent-color) !important;
      color: var(--accent-color) !important;
    }

    .swagger-ui input[type=text],
    .swagger-ui textarea {
      background: var(--input-bg) !important;
      color: var(--text-color) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 2px !important;
    }

    .swagger-ui table thead tr td,
    .swagger-ui table thead tr th {
      color: var(--text-color) !important;
      border-bottom: 1px solid var(--border-color) !important;
    }

    .swagger-ui .model-box {
      background: var(--input-bg) !important;
      border: 1px solid var(--border-color) !important;
      padding: 10px !important;
    }

    .swagger-ui .model-box-control:focus {
      outline: none !important;
    }

    .swagger-ui section.models {
      border: 1px solid var(--border-color) !important;
      border-radius: 2px !important;
      background: var(--card-bg) !important;
    }

    .swagger-ui section.models.is-open h4 {
      border-bottom: 1px solid var(--border-color) !important;
      color: var(--text-color) !important;
    }

    /* Style Swagger UI authorization modal & dialogs */
    .swagger-ui .dialog-ux .modal-ux {
      background: var(--card-bg) !important;
      border: 1px solid var(--border-color) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3) !important;
      border-radius: 2px !important;
    }
    .swagger-ui .dialog-ux .modal-ux-header {
      border-bottom: 1px solid var(--border-color) !important;
      padding: 16px 20px !important;
    }
    .swagger-ui .dialog-ux .modal-ux-header h3,
    .swagger-ui .dialog-ux .modal-ux-content h4,
    .swagger-ui .dialog-ux .modal-ux-content p,
    .swagger-ui .dialog-ux .modal-ux-content label,
    .swagger-ui .auth-container,
    .swagger-ui .auth-container h2,
    .swagger-ui .auth-container h3,
    .swagger-ui .auth-container h4,
    .swagger-ui .auth-container label,
    .swagger-ui .auth-container .wrapper,
    .swagger-ui .auth-container .key-area {
      color: var(--text-color) !important;
    }
    .swagger-ui .dialog-ux .modal-ux-content {
      padding: 20px !important;
    }

    .swagger-ui section.models h4 {
      color: var(--text-color) !important;
    }

    .swagger-ui section.models .model-container {
      background: var(--input-bg) !important;
      border: 1px solid var(--border-color) !important;
      margin: 10px 0 !important;
    }

    /* Style HTTP methods borders appropriately */
    .swagger-ui .opblock.opblock-get {
      background: var(--card-bg) !important;
      border-color: #0f62fe !important;
    }
    .swagger-ui .opblock.opblock-post {
      background: var(--card-bg) !important;
      border-color: #198038 !important;
    }
    .swagger-ui .opblock.opblock-delete {
      background: var(--card-bg) !important;
      border-color: #da1e28 !important;
    }
    .swagger-ui .opblock.opblock-put {
      background: var(--card-bg) !important;
      border-color: #b28300 !important;
    }

    /* Responses and other code blocks */
    .swagger-ui .opblock-body pre {
      background: var(--input-bg) !important;
      color: var(--text-color) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 2px !important;
    }

    .swagger-ui .opblock-body pre.microlight {
      background: var(--input-bg) !important;
    }

    .swagger-ui .expand-methods, .swagger-ui .expand-operation {
      fill: var(--text-color) !important;
    }
  </style>
  <script>
    // Theme synchronization script
    const getPreferredTheme = () => {
      const stored = localStorage.getItem("starlight-theme");
      if (stored === "light" || stored === "dark") return stored;
      return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    };

    const setTheme = (theme) => {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("starlight-theme", theme);
    };

    // Apply theme immediately
    setTheme(getPreferredTheme());
  </script>
</head>
<body>
  <div class="swagger-header-container">
    <div class="brand">
      <img src="./logo-small.jpg" alt="Synergia" class="logo" />
      <span>SYNERGIA // REST SWAGGER PLAYGROUND</span>
    </div>
    <div class="actions">
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sun-icon">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="moon-icon">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <a href="./docs/api-rest/" class="back-btn">← VOLVER A LAS DOCS</a>
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        deepLinking: true
      });
      window.ui = ui;

      // Register theme switcher action
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        setTheme(newTheme);
      });
    };
  </script>
</body>
</html>
